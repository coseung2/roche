name: Feature request
description: 새 기능 또는 제품 동작 변경을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 구현 방법보다 먼저 해결해야 하는 사용자/제품 문제를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: 완료 후 사용자가 할 수 있어야 하는 일을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / invariants
      description: 성능, lifecycle, worktree, state, security 등 깨지면 안 되는 조건을 적어주세요.
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - P0 - blocks current milestone
        - P1 - important next
        - P2 - planned improvement
        - P3 - later / exploratory
    validations:
      required: true
  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture impact
      options:
        - label: 장기적인 architecture decision이면 ADR이 필요합니다.
